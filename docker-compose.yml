# Local development database (ARC-11; web and worker services arrive with leaf 1.4.1, BLD-8 R-4).
# Start: docker compose up -d postgres
# Then:  DATABASE_URL=postgres://postgres:postgres@localhost:5432/mealplanner
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mealplanner
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mealplanner"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
