<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Nunito:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Tabs" style="width: 390px; height: 84px; box-sizing: border-box; padding: 8px 10px 18px; background: #FFFFFF; border-top: 1px solid #EADFCC; font-family: Nunito, sans-serif; color: #6B5B4B; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
  <sc-for list="{{items}}" as="item" hint-placeholder-count="5">
    <a href="{{item.href}}" style="{{item.style}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.icon}}"></path></svg>
      <span>{{item.label}}</span>
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","plan","recipes","reviews","me"],"default":"today"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    const base = 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; border-radius: 12px; text-decoration: none; font-size: 12px; font-weight: 800;';
    const list = [
      { key: 'today', label: 'Today', href: 'TodayPhone.dc.html', icon: 'M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4M16 12a4 4 0 1 1-8 0a4 4 0 0 1 8 0' },
      { key: 'plan', label: 'Plan', href: 'WeekPlan.dc.html', icon: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4' },
      { key: 'recipes', label: 'Recipes', href: 'RecipeLibrary.dc.html', icon: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5M8 7h7' },
      { key: 'reviews', label: 'Reviews', href: 'QuickRatePhone.dc.html', icon: 'M12 3l2.7 5.6l6.1.9l-4.4 4.3l1 6.1L12 17l-5.4 2.9l1-6.1L3.2 9.5l6.1-.9z' },
      { key: 'me', label: 'Me', href: 'TastePhone.dc.html', icon: 'M12 11a4 4 0 1 0 0-8a4 4 0 0 0 0 8zM4 21v-1a8 8 0 0 1 16 0v1' }
    ];
    return {
      items: list.map((it) => ({
        ...it,
        style: base + (it.key === active ? ' color: #C4411E; background: #FDE3D8;' : ' color: #6B5B4B;')
      }))
    };
  }
}
</script>
</body>
</html>
